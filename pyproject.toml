[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "simple_dag"
dynamic = ["version"]
description = "Create simple Pipelines with Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Tim Rohner", email = "info@timrohner.ch"}]
keywords = ["simple_dag"]
requires-python = ">=3.10"
# homepage = "https://github.com/leokster/simple_dag"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]
dependencies = [
    "aiohttp >=3.9.0, <4",
    "click >=8.1, <9",
    "dagster-webserver >=1.12.0, <2",
    "dagster >=1.12.0, <2",
    "fsspec >=2024.2.0",
    "matplotlib >=3.8.0, <4",
    "pandas >=2.2.0, <4",
    "pydantic >=2.0, <3",
    "requests >=2.31.0, <3",
]

[project.urls]
Source = "https://github.com/leokster/simple_dag"


[project.optional-dependencies]
dev = [
    "black >=24.0.0, <27",
    "build >=1.0",
    "flake8 >=7.0",
    "pytest >=8.0",
    "tox >=4.0, <5",
    "twine >=6, <8"
]


[tool.setuptools.packages.find]
include = ["simple_dag", "simple_dag.*"]

[tool.setuptools.package-data]
simple_dag = ["py.typed"]

[tool.setuptools_scm]
write_to = "simple_dag/_version.py"
